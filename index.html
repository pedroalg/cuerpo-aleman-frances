<title>Der Körper · Le corps</title>
<style>
:root {
  color-scheme: light;
  --paper: #fbf8f1; --card: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e1d6;
  --de: #b91c1c; --de-soft: #fde8e8; --fr: #1d4ed8; --fr-soft: #e3ebfd;
  --ok: #15803d; --ok-soft: #dcf5e4; --ko: #dc2626; --ko-soft: #fde4e4; --almost: #c2410c; --almost-soft: #ffedd5;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", Arial, sans-serif }
body { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto;
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); overscroll-behavior: none }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }

header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 6px }
h1 { font-size: 18px; margin: 0; letter-spacing: -.2px; white-space: nowrap }
h1 .d { color: var(--de) } h1 .f { color: var(--fr) }
.seg { display: inline-flex; background: #efe9dc; border-radius: 999px; padding: 3px }
.seg button { padding: 6px 11px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted) }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.seg button.on[data-lang=de] { color: var(--de) } .seg button.on[data-lang=fr] { color: var(--fr) }

nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 0 6px }
nav button { padding: 8px 2px; border-radius: 12px; font-size: 13px; font-weight: 600; background: #f1ece2; color: var(--muted) }
nav button .e { display: block; font-size: 19px; line-height: 1.2 }
nav button.on { background: var(--ink); color: #fff }

#stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--line); overflow: hidden; touch-action: manipulation }
#fig { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none }
.body { fill: none; stroke: var(--ink); stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke }
.fill { fill: #fff }
.hair { fill: #fff; stroke: var(--ink); stroke-width: 2px; stroke-linejoin: round; vector-effect: non-scaling-stroke }
.thin { fill: none; stroke: var(--ink); stroke-width: 1.1px; stroke-linecap: round; vector-effect: non-scaling-stroke }
.ink { fill: var(--ink) }
.mk { fill: #fff; stroke: var(--muted); stroke-width: 1.6px; vector-effect: non-scaling-stroke; opacity: .9 }
.mk.seen { fill: var(--ink); stroke: var(--ink) }
.mk.sel { fill: var(--ink); stroke: var(--ink) }
.ring { fill: none; stroke-width: 3px; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center }
.ring.target { stroke: #a16207; animation: pulse 1.1s ease-in-out infinite }
.ring.ok { stroke: var(--ok) } .ring.ko { stroke: var(--ko) } .ring.sel { stroke: var(--ink) }
.tap { fill: var(--ko); opacity: .85 }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.35); opacity: .55 } }
#zoom { position: absolute; right: 10px; top: 10px; background: var(--paper); border: 1px solid var(--line);
  padding: 7px 11px; border-radius: 999px; font-size: 14px; font-weight: 600 }
#chip { position: absolute; left: 10px; top: 10px; background: var(--paper); border: 1px solid var(--line);
  padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; display: none }
.hint { position: absolute; left: 12px; max-width: 30%; top: 14px; text-align: left; color: var(--muted); font-size: 14px; pointer-events: none }

#panel { flex: 0 0 auto; min-height: 150px; padding: 10px 0 12px }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px }
.word { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 }
.word .w { font-size: 26px; font-weight: 700; letter-spacing: -.3px }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; margin-right: 8px; vertical-align: 4px }
.de .tag { background: var(--de-soft); color: var(--de) } .de .w { color: var(--de) }
.fr .tag { background: var(--fr-soft); color: var(--fr) } .fr .w { color: var(--fr) }
.es { color: var(--muted); font-size: 15px; margin-top: 4px }
.say { width: 44px; height: 44px; border-radius: 50%; background: #f1ece2; font-size: 20px; flex: 0 0 auto }
.prompt { font-size: 15px; color: var(--muted); margin-bottom: 2px }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.4px }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 13px 6px; font-size: 18px; font-weight: 700; min-height: 54px }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok) }
.opt.ko { border-color: var(--ko); background: var(--ko-soft); color: var(--ko) }
.opt:disabled { opacity: 1 }
.fb { margin-top: 8px; font-size: 16px; font-weight: 600; min-height: 22px }
.fb.ok { color: var(--ok) } .fb.ko { color: var(--ko) } .fb.almost { color: var(--almost) }
.fb small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px }
.next { margin-top: 10px; width: 100%; background: var(--ink); color: #fff; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 700 }
.ghost { background: #f1ece2; color: var(--ink) }
input.answer { width: 100%; font-size: 22px; font-weight: 600; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); margin-top: 8px }
input.answer:focus { outline: none; border-color: var(--ink) }
input.answer.ok { border-color: var(--ok); background: var(--ok-soft) } input.answer.ko { border-color: var(--ko); background: var(--ko-soft) }
input.answer.almost { border-color: var(--almost); background: var(--almost-soft) }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.keys button { min-width: 40px; height: 40px; border-radius: 10px; background: #f1ece2; font-size: 19px; font-weight: 600 }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }

#over { position: fixed; inset: 0; background: rgba(28,25,23,.45); display: none; align-items: flex-end; justify-content: center; z-index: 5 }
#over.show { display: flex }
#over .sheet { background: var(--paper); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85dvh; overflow: auto }
.stars { font-size: 44px; text-align: center; letter-spacing: 6px }
.score { text-align: center; font-size: 22px; font-weight: 800; margin: 4px 0 2px }
.msg { text-align: center; color: var(--muted); margin-bottom: 12px }
.miss { list-style: none; padding: 0; margin: 0 0 12px }
.miss li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 600 }
.miss .d { color: var(--de) } .miss .f { color: var(--fr) } .miss .s { color: var(--muted); font-weight: 500 }
.progress { display: flex; gap: 4px; margin-bottom: 8px }
.progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line) }
.progress i.ok { background: var(--ok) } .progress i.ko { background: var(--ko) } .progress i.now { background: var(--ink) }
</style>
</head>

<ellipse cx="105" cy="136" rx="0.8" ry="1.2" class="thin"/></g>
    <g id="marks"></g>
    <g id="fx"></g>
  </svg>
  <button id="zoom">🔍 Cara</button>
  <div id="chip"></div>
  <div class="hint" id="hint"></div>
</main>
<section id="panel"></section>
<div id="over"><div class="sheet" id="sheet"></div></div>

<script>
const PARTS = [{"id": "haar", "de": ["das Haar", "die Haare"], "fr": ["les cheveux"], "es": "el pelo", "view": "face", "pts": [[99, 43.6], [109, 43.2], [95.6, 49]]}, {"id": "auge", "de": ["das Auge"], "fr": ["l'œil", "l'oeil"], "es": "el ojo", "view": "face", "pts": [[100.4, 53.4], [109.6, 53.4]]}, {"id": "nase", "de": ["die Nase"], "fr": ["le nez"], "es": "la nariz", "view": "face", "pts": [[105, 58.6]]}, {"id": "mund", "de": ["der Mund"], "fr": ["la bouche"], "es": "la boca", "view": "face", "pts": [[105, 63.9]]}, {"id": "ohr", "de": ["das Ohr"], "fr": ["l'oreille"], "es": "la oreja", "view": "face", "pts": [[117.6, 55], [92.4, 55]]}, {"id": "kinn", "de": ["das Kinn"], "fr": ["le menton"], "es": "la barbilla", "view": "face", "pts": [[105, 67.6]]}, {"id": "kopf", "de": ["der Kopf"], "fr": ["la tête"], "es": "la cabeza", "view": "body", "pts": [[105, 53]]}, {"id": "hals", "de": ["der Hals"], "fr": ["le cou"], "es": "el cuello", "view": "body", "pts": [[105, 74]]}, {"id": "schulter", "de": ["die Schulter"], "fr": ["l'épaule"], "es": "el hombro", "view": "body", "pts": [[126.5, 85], [83.5, 85]]}, {"id": "brust", "de": ["die Brust"], "fr": ["la poitrine"], "es": "el pecho", "view": "body", "pts": [[113, 99], [97, 99]]}, {"id": "arm", "de": ["der Arm"], "fr": ["le bras"], "es": "el brazo", "view": "body", "pts": [[132.6, 104], [77.4, 104]]}, {"id": "ellbogen", "de": ["der Ellbogen", "der Ellenbogen"], "fr": ["le coude"], "es": "el codo", "view": "body", "pts": [[134.4, 125.4], [75.6, 125.4]]}, {"id": "bauch", "de": ["der Bauch"], "fr": ["le ventre"], "es": "la barriga", "view": "body", "pts": [[105, 120]]}, {"id": "nabel", "de": ["der Bauchnabel"], "fr": ["le nombril"], "es": "el ombligo", "view": "body", "pts": [[105, 136]]}, {"id": "handgelenk", "de": ["das Handgelenk"], "fr": ["le poignet"], "es": "la muñeca", "view": "body", "pts": [[139.4, 164.6], [70.6, 164.6]]}, {"id": "hand", "de": ["die Hand"], "fr": ["la main"], "es": "la mano", "view": "body", "pts": [[139.4, 176], [70.6, 176]]}, {"id": "finger", "de": ["der Finger"], "fr": ["le doigt"], "es": "el dedo", "view": "body", "pts": [[142.2, 187], [67.8, 187]]}, {"id": "huefte", "de": ["die Hüfte"], "fr": ["la hanche"], "es": "la cadera", "view": "body", "pts": [[121.6, 154], [88.4, 154]]}, {"id": "oberschenkel", "de": ["der Oberschenkel"], "fr": ["la cuisse"], "es": "el muslo", "view": "body", "pts": [[114, 188], [96, 188]]}, {"id": "knie", "de": ["das Knie"], "fr": ["le genou"], "es": "la rodilla", "view": "body", "pts": [[113.4, 211.5], [96.6, 211.5]]}, {"id": "bein", "de": ["das Bein"], "fr": ["la jambe"], "es": "la pierna", "view": "body", "pts": [[114, 238], [96, 238]]}, {"id": "knoechel", "de": ["der Knöchel"], "fr": ["la cheville"], "es": "el tobillo", "view": "body", "pts": [[114.2, 260.6], [95.8, 260.6]]}, {"id": "fuss", "de": ["der Fuß", "der Fuss"], "fr": ["le pied"], "es": "el pie", "view": "body", "pts": [[112, 270], [98, 270]]}, {"id": "zeh", "de": ["der Zeh", "die Zehe"], "fr": ["l'orteil"], "es": "el dedo del pie", "view": "body", "pts": [[118.4, 275.2], [91.6, 275.2]]}];
const VIEWS = { body: [58, 38, 94, 242], face: [86.5, 36.5, 37, 40] };
const ROUND = 10;
const $ = s => document.querySelector(s);
const svg = $('#fig'), marks = $('#marks'), fx = $('#fx'), panel = $('#panel');
const NS = 'http://www.w3.org/2000/svg';

// ---------- storage (optional) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('koerper-' + k); return v == null ? d : JSON.parse(v) } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem('koerper-' + k, JSON.stringify(v)) } catch (e) {} }
};
let lang = store.get('lang', 'both');
let mode = 'learn';
let view = 'body';
let stats = store.get('stats', {});
let seen = new Set();
let round = null, q = null;

// ---------- sound + speech ----------
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [300, 220];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'triangle' : 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}
function voiceFor(l) {
  try {
    const vs = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(l));
    return vs.find(v => /premium|enhanced|siri/i.test(v.name)) || vs.find(v => v.localService) || vs[0];
  } catch (e) { return null }
}
function speak(list, cancel = true) {
  try {
    if (!('speechSynthesis' in window)) return;
    if (cancel) speechSynthesis.cancel();
    list.forEach(([text, l]) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = l === 'de' ? 'de-DE' : 'fr-FR';
      const v = voiceFor(l); if (v) u.voice = v;
      u.rate = 0.85;
      speechSynthesis.speak(u);
    });
  } catch (e) {}
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {} } catch (e) {}

// ---------- view ----------
let anim = null;
function setView(v, instant) {
  view = v;
  $('#zoom').textContent = v === 'body' ? '🔍 Cara' : '🧍 Cuerpo';
  const from = svg.getAttribute('viewBox').split(' ').map(Number), to = VIEWS[v];
  cancelAnimationFrame(anim);
  if (instant) { svg.setAttribute('viewBox', to.join(' ')); drawMarks(); return }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 320), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    svg.setAttribute('viewBox', from.map((a, i) => a + (to[i] - a) * e).join(' '));
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
  drawMarks();
}
const unit = () => VIEWS[view][2] / 94;   // marker size follows the zoom
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || fx).appendChild(n); return n;
}
function drawMarks() {
  marks.innerHTML = '';
  if (mode !== 'learn') return;
  PARTS.filter(p => p.view === view).forEach(p => p.pts.forEach(([x, y]) =>
    el('circle', { cx: x, cy: y, r: 1.5 * unit(), class: 'mk' + (seen.has(p.id) ? ' seen' : '') }, marks)));
}
function clearFx() { fx.innerHTML = '' }
function ring(p, cls) {
  p.pts.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 3.4 * unit(), class: 'ring ' + cls }));
  p.pts.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 1.2 * unit(), class: cls === 'ko' ? 'tap' : 'ink' }));
}
function svgPoint(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function nearest(pt, list) {
  let best = null, bd = 1e9;
  list.forEach(p => p.pts.forEach(([x, y]) => {
    const d = Math.hypot(x - pt.x, y - pt.y);
    if (d < bd) { bd = d; best = p }
  }));
  return { p: best, d: bd };
}
const distTo = (p, pt) => Math.min(...p.pts.map(([x, y]) => Math.hypot(x - pt.x, y - pt.y)));

// ---------- words ----------
const word = (p, l) => p[l][0];
const langsNow = () => lang === 'both' ? ['de', 'fr'] : [lang];
const pickLang = () => lang === 'both' ? (Math.random() < .5 ? 'de' : 'fr') : lang;
const LNAME = { de: 'alemán', fr: 'francés' };
function wordBlock(p, l) {
  return `<div class="word ${l}"><div><span class="tag">${l.toUpperCase()}</span><span class="w">${word(p, l)}</span></div>
    <button class="say" data-say="${l}" aria-label="Escuchar">🔊</button></div>`;
}
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b && b.dataset.p) speak([[word(PARTS.find(p => p.id === b.dataset.p), b.dataset.say), b.dataset.say]]);
});
function sayButtons(p) { panel.querySelectorAll('[data-say]').forEach(b => b.dataset.p = p.id) }

// ---------- modes ----------
function setMode(m) {
  mode = m; clearFx(); closeOver();
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#zoom').style.display = m === 'learn' ? '' : 'none';
  $('#chip').style.display = 'none';
  if (m === 'learn') { setView(view, true); learnIntro(); }
  else startRound();
}
function learnIntro() {
  $('#hint').textContent = view === 'body' ? 'Toca el dibujo' : 'Toca la cara';
  panel.innerHTML = `<div class="card"><div class="prompt">Aprende</div>
    <div style="font-size:17px;font-weight:600">Toca el dibujo y escucha cómo se dice.</div>
    <div class="es">${seen.size} de ${PARTS.length} vistas</div></div>`;
}
function learnTap(pt) {
  const cand = PARTS.filter(p => p.view === view);
  const { p } = nearest(pt, cand);
  if (!p) return;
  seen.add(p.id); clearFx(); ring(p, 'sel'); drawMarks();
  $('#hint').textContent = '';
  panel.innerHTML = `<div class="card">${langsNow().map(l => wordBlock(p, l)).join('')}<div class="es">🇪🇸 ${p.es}</div></div>`;
  sayButtons(p);
  speak(langsNow().map(l => [word(p, l), l]));
}

// ---------- rounds ----------
function weight(p) {
  return langsNow().reduce((s, l) => { const st = stats[l + ':' + p.id] || { ok: 0, ko: 0 }; return s + (1 + 2 * st.ko) / (1 + st.ok) }, 0);
}
function pickParts(n, pool) {
  pool = (pool || PARTS).slice(); const out = [];
  while (out.length < n && pool.length) {
    const ws = pool.map(weight), tot = ws.reduce((a, b) => a + b, 0);
    let r = Math.random() * tot, i = 0;
    while (r > ws[i] && i < ws.length - 1) { r -= ws[i]; i++ }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function startRound(pool) {
  round = { qs: pickParts(pool ? pool.length : ROUND, pool), i: 0, score: 0, res: [], miss: [] };
  ask();
}
function progressBar() {
  return `<div class="progress">${round.qs.map((_, i) =>
    `<i class="${i < round.res.length ? (round.res[i] ? 'ok' : 'ko') : (i === round.i ? 'now' : '')}"></i>`).join('')}</div>`;
}
function ask() {
  clearFx();
  const p = round.qs[round.i];
  q = { p, l: pickLang(), done: false };
  setView(p.view);
  $('#hint').textContent = '';
  $('#chip').style.display = ''; $('#chip').textContent = `⭐ ${round.score}`;
  if (mode === 'find') {
    $('#hint').textContent = 'Toca el dibujo';
    panel.innerHTML = `<div class="card">${progressBar()}<div class="prompt">¿Dónde está…?</div>
      <div class="row ${q.l}"><div class="big w">${word(p, q.l)}</div><button class="say" data-say="${q.l}">🔊</button></div>
      <div class="fb" id="fb"></div><div id="after"></div></div>`;
    sayButtons(p);
    speak([[word(p, q.l), q.l]]);
  } else if (mode === 'choose') {
    ring(p, 'target');
    const others = pickParts(3, PARTS.filter(x => x !== p)).map(x => x);
    const opts = [p, ...others].sort(() => Math.random() - .5);
    panel.innerHTML = `<div class="card">${progressBar()}<div class="prompt">¿Cómo se dice en ${LNAME[q.l]}?</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-id="${o.id}" style="color:var(--${q.l})">${word(o, q.l)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div><div id="after"></div></div>`;
    panel.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b));
  } else if (mode === 'write') {
    ring(p, 'target');
    const keys = q.l === 'de' ? ['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'] : ['é', 'è', 'ê', 'à', 'ç', 'ô', 'œ', "'"];
    panel.innerHTML = `<div class="card">${progressBar()}<div class="row"><div class="prompt">Escribe en <b style="color:var(--${q.l})">${LNAME[q.l]}</b>, con el artículo</div>
      <button class="ghost" id="clue" style="padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600">💡 Pista</button></div>
      <form id="wf" autocomplete="off"><input class="answer" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false"
        enterkeyhint="done" placeholder="${q.l === 'de' ? 'der / die / das …' : 'le / la / l\' / les …'}"></form>
      <div class="keys">${keys.map(k => `<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
      <div class="fb" id="fb"></div><div id="after"><button class="next" id="check">Comprobar</button></div></div>`;
    const inp = $('#ans');
    panel.querySelectorAll('[data-k]').forEach(b => b.onpointerdown = e => {
      e.preventDefault();
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + b.dataset.k + inp.value.slice(en);
      inp.setSelectionRange(s + b.dataset.k.length, s + b.dataset.k.length);
      inp.focus();
    });
    $('#wf').onsubmit = e => { e.preventDefault(); checkWrite() };
    $('#check').onclick = checkWrite;
    $('#clue').onclick = () => {
      const w = word(p, q.l), noun = w.replace(/^(der|die|das|le|la|les|l')\s?/i, '');
      $('#fb').className = 'fb'; $('#fb').innerHTML = `💡 ${p.es} · empieza por «${noun[0]}…»`;
    };
  }
}
function record(ok) {
  const k = q.l + ':' + q.p.id, st = stats[k] || { ok: 0, ko: 0 };
  ok ? st.ok++ : st.ko++; stats[k] = st; store.set('stats', stats);
  round.res.push(ok); if (ok) round.score++; else round.miss.push(q.p);
  $('#chip').textContent = `⭐ ${round.score}`;
  q.done = true;
  beep(ok);
  const last = round.i === round.qs.length - 1;
  $('#after').innerHTML = `<button class="next" id="nx">${last ? 'Ver resultado' : 'Siguiente →'}</button>`;
  $('#nx').onclick = () => { if (last) finish(); else { round.i++; ask() } };
  const bar = panel.querySelector('.progress'); if (bar) bar.outerHTML = progressBar();
}
function findTap(pt) {
  if (!q || q.done) return;
  const cand = PARTS.filter(p => p.view === view);
  const { p } = nearest(pt, cand);
  const lenient = 4.2 * unit();
  const ok = p === q.p || distTo(q.p, pt) <= lenient;
  clearFx();
  if (ok) {
    ring(q.p, 'ok');
    $('#fb').className = 'fb ok'; $('#fb').innerHTML = '¡Muy bien! 🎉';
  } else {
    el('circle', { cx: pt.x, cy: pt.y, r: 1.4 * unit(), class: 'tap' });
    ring(q.p, 'ok');
    $('#fb').className = 'fb ko';
    $('#fb').innerHTML = `Eso es <b>${word(p, q.l)}</b>.<small>La respuesta está marcada en verde.</small>`;
  }
  $('#hint').textContent = '';
  record(ok);
  speak([[word(q.p, q.l), q.l]]);
}
function choose(b) {
  if (q.done) return;
  const ok = b.dataset.id === q.p.id;
  panel.querySelectorAll('.opt').forEach(o => {
    o.disabled = true;
    if (o.dataset.id === q.p.id) o.classList.add('ok'); else if (o === b) o.classList.add('ko');
  });
  clearFx(); ring(q.p, ok ? 'ok' : 'ko');
  $('#fb').className = 'fb ' + (ok ? 'ok' : 'ko');
  $('#fb').innerHTML = ok ? '¡Muy bien! 🎉' : `Es <b>${word(q.p, q.l)}</b> <small>(${q.p.es})</small>`;
  record(ok);
  speak([[word(q.p, q.l), q.l]]);
}

// ---------- checking what she wrote ----------
const norm = s => s.replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').replace(/\s*'\s*/g, "'").trim().replace(/[.!?,;]+$/, '');
const plain = s => norm(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/œ/g, 'oe');
const split = w => { const m = norm(w).match(/^(der|die|das|les|le|la|l')\s?(.*)$/i); return m ? [m[1].toLowerCase(), m[2]] : ['', norm(w)] };
function checkWrite() {
  if (q.done) return;
  const inp = $('#ans'), raw = inp.value;
  if (!norm(raw)) { inp.focus(); return }
  const answers = q.p[q.l], main = answers[0], fb = $('#fb');
  const n = norm(raw).toLowerCase(), pl = plain(raw);
  let res = 'ko', msg = '';
  if (answers.some(a => norm(a).toLowerCase() === n)) {
    res = 'ok'; msg = '¡Perfecto! 🎉';
    if (q.l === 'de') {
      const noun = split(raw)[1];
      if (noun && noun[0] === noun[0].toLowerCase()) { res = 'almost'; msg = '¡Bien! <small>En alemán el sustantivo va con mayúscula: ' + main + '</small>' }
    }
  } else if (answers.some(a => plain(a) === pl)) {
    res = 'almost'; msg = `¡Casi! Mira los acentos: <b>${main}</b>`;
  } else if (answers.some(a => plain(split(a)[1]) === pl)) {
    msg = `Falta el artículo: <b>${main}</b>`;
  } else if (answers.some(a => plain(split(a)[1]) === plain(split(raw)[1]))) {
    msg = `El artículo no es ese: <b>${main}</b>`;
  } else {
    msg = `Es <b>${main}</b> <small>(${q.p.es})</small>`;
  }
  inp.classList.add(res); inp.readOnly = true; inp.blur();
  fb.className = 'fb ' + res; fb.innerHTML = msg;
  clearFx(); ring(q.p, res === 'ko' ? 'ko' : 'ok');
  record(res !== 'ko');
  speak([[main, q.l]]);
}

// ---------- end of a round ----------
function finish() {
  const s = round.score, n = round.qs.length, st = s >= n * .9 ? 3 : s >= n * .7 ? 2 : s >= n * .4 ? 1 : 0;
  const msgs = ['¡A practicar un poco más!', '¡Bien! Vas aprendiendo.', '¡Muy bien!', '¡Genial! ¡Eres una crack!'];
  const miss = [...new Map(round.miss.map(p => [p.id, p])).values()];
  $('#sheet').innerHTML = `<div class="stars">${'⭐'.repeat(st)}${'<span style="opacity:.2">⭐</span>'.repeat(3 - st)}</div>
    <div class="score">${s} de ${n}</div><div class="msg">${msgs[st]}</div>
    ${miss.length ? `<div class="prompt">Para repasar</div><ul class="miss">${miss.map(p =>
      `<li><span><span class="d">${p.de[0]}</span> · <span class="f">${p.fr[0]}</span></span><span class="s">${p.es}</span></li>`).join('')}</ul>` : ''}
    <div class="btns">${miss.length ? '<button class="next ghost" id="rv">Repasar fallos</button>' : ''}
    <button class="next" id="again" ${miss.length ? '' : 'style="grid-column:1/-1"'}>Otra ronda</button></div>`;
  $('#over').classList.add('show');
  $('#again').onclick = () => { closeOver(); startRound() };
  if (miss.length) $('#rv').onclick = () => { closeOver(); startRound(miss) };
}
function closeOver() { $('#over').classList.remove('show') }

// ---------- wiring ----------
svg.addEventListener('pointerdown', e => {
  const pt = svgPoint(e);
  if (mode === 'learn') learnTap(pt);
  else if (mode === 'find') findTap(pt);
});
$('#zoom').onclick = () => { clearFx(); setView(view === 'body' ? 'face' : 'body'); learnIntro() };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
function setLang(l) {
  lang = l; store.set('lang', l);
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
}
document.querySelectorAll('#lang button').forEach(b => b.onclick = () => { setLang(b.dataset.lang); setMode(mode) });
setLang(lang);
setMode('learn');
</script>
</body>
</html>
